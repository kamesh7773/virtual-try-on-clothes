name: virtual_try_on
description: "Mirror — see sports apparel styled on you, then shop it."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # Flutter SDK Dependencies
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_hooks: ^0.21.2
  hooks_riverpod: ">=3.0.0 <3.2.1"
  riverpod_annotation: ">=4.0.0 <4.0.2"

  # UI Components and Responsive Design
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.3

  # Networking and API
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Storage and Database
  shared_preferences: ^2.3.5

  # Utilities and Helpers
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.1.0
  permission_handler: ^12.0.0+1

  # In-app browser
  webview_flutter: ^4.14.1
  # The endorsed platform packages. Listed directly because the browser
  # reaches for platform-only settings — camera/mic prompts on Android,
  # inline media on iOS — and importing a transitive dependency trips
  # `depend_on_referenced_packages`.
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  image_picker: ^1.2.3
  file_picker: ^13.1.0

  # Style Me flow: the body snapshot is taken on a native preview, and the
  # intro plays its looping model video without a browser underneath it.
  camera: ^0.12.1
  video_player: ^2.14.0
  # Shrinks the snapshot to the size the styling service works at, with the
  # camera's EXIF rotation baked in.
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Lets tests swap in a fake permission platform instead of the real channel.
  permission_handler_platform_interface: ^4.3.0
  # Lets the Style Me screen tests stand in a camera list for the plugin.
  camera_platform_interface: ^2.14.0

  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ">=4.0.0 <4.0.2"
  flutter_gen_runner: 5.11.0

  # App icon and native splash screen
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_gen:
  output: lib/core/constants/
  line_length: 80
  integrations:
    image: true
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
      class_name: AppAssets
    exclude:
      - .env.development
      - .env.staging
      - .env.production
  fonts:
    enabled: true

flutter:
  uses-material-design: true
  fonts:
    # The Style Me screens' type, as the web mirror set it.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
    # The hand-written notes around the capture frame.
    - family: CaveatBrush
      fonts:
        - asset: assets/fonts/CaveatBrush-Regular.ttf
  assets:
    - assets/icons/
    - assets/style_me/
    - .env.development
    - .env.staging
    - .env.production

# App launcher icon (Android + iOS)
# Drop a 1024x1024 PNG at assets/icons/app_logo.png, then run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # Adaptive icon settings (Android 8+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_logo.png"
  adaptive_icon_monochrome: "assets/icons/app_logo.png"

# Native splash screen (Android + iOS)
# Drop a square PNG at assets/icons/app_splash.png, then run:
#   dart run flutter_native_splash:create
# To remove the splash later:
#   dart run flutter_native_splash:remove
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/app_splash.png"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  # Android 12+ uses a different splash mechanism — a foreground icon on a
  # background color. Keep the same logo for consistency.
  android_12:
    image: "assets/icons/app_splash.png"
    icon_background_color: "#FFFFFF"